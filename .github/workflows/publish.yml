name: Publish NuGet packages

on:
  # Manual only - never runs on commit/merge.
  workflow_dispatch:
    inputs:
      publish_to_nuget:
        description: "Also publish this build to nuget.org (public release)"
        type: boolean
        default: false

jobs:
  publish:
    environment: release      # must match the "Environment" scoping on the nuget.org trusted-publisher policy
    permissions:
      contents: read
      id-token: write          # required for nuget.org OIDC trusted publishing
      packages: write          # required to publish to GitHub Packages
    env:
      DOTNET_NOLOGO: true

    runs-on: windows-latest
    steps:
    - name: Clone source
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x

    - name: "Install .NET workloads"
      run: |
        dotnet workload install android
        dotnet workload install ios
        dotnet workload install maccatalyst
        dotnet workload install maui
        dotnet workload list

    - name: "Restore and build solution"
      run: dotnet build Plugin.Maui.Microchart.slnx --configuration Release -p:VersionPrelease=.${{ github.run_number }}

    - name: "Pack Plugin.Maui.Microchart Core"
      run: dotnet pack src/Plugin.Maui.Microchart.Core/Plugin.Maui.Microchart.Core.csproj --configuration Release --no-build -p:VersionPrelease=.${{ github.run_number }}

    - name: "Pack Plugin.Maui.Microchart Droid"
      run: dotnet pack src/Plugin.Maui.Microchart.Droid/Plugin.Maui.Microchart.Droid.csproj --configuration Release --no-build -p:VersionPrelease=.${{ github.run_number }}

    - name: "Pack Plugin.Maui.Microchart iOS"
      run: dotnet pack src/Plugin.Maui.Microchart.iOS/Plugin.Maui.Microchart.iOS.csproj --configuration Release --no-build -p:VersionPrelease=.${{ github.run_number }}

    - name: "Pack Plugin.Maui.Microchart MAUI"
      run: dotnet pack src/Plugin.Maui.Microchart/Plugin.Maui.Microchart.csproj --configuration Release --no-build -p:VersionPrelease=.${{ github.run_number }}

    - name: "Pack Plugin.Maui.Microchart Meta-package"
      run: dotnet pack src/Plugin.Maui.Microchart.Metapackage/Plugin.Maui.Microchart.Metapackage.csproj --configuration Release -p:VersionPrelease=.${{ github.run_number }}

    # Always publish the build to GitHub Packages (prerelease/CI feed).
    - name: Publish packages to GitHub Packages
      run: |
        dotnet nuget add source --username ${{ github.repository_owner }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
        Get-ChildItem artifacts/*.nupkg | ForEach-Object { dotnet nuget push $_.FullName --skip-duplicate --no-symbols --source github }

    # Publish to nuget.org only when explicitly requested via the workflow input.
    - name: NuGet login (OIDC -> short-lived API key)
      if: ${{ inputs.publish_to_nuget }}
      uses: NuGet/login@v1
      id: login
      with:
        user: xracer          # nuget.org username (profile name) -- the account that created the trusted-publisher policy, not the GitHub handle

    - name: Publish packages to nuget.org
      if: ${{ inputs.publish_to_nuget }}
      run: |
        Get-ChildItem artifacts/*.nupkg |
          ForEach-Object { dotnet nuget push $_.FullName --skip-duplicate --no-symbols --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json }
